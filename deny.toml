# cargo-deny: license / advisory / duplicate-dependency gate used in CI.
[licenses]
# Lumina's own crates (publish = false) are GPL-3.0-only; this gate is about
# the licenses of the dependencies.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  # webpki-roots / webpki-root-certs (Mozilla's CA list, used by every rustls
  # HTTPS client including Tauri's): a permissive open-data licence.
  "CDLA-Permissive-2.0",
  # notify (the projects-folder watcher): a public-domain dedication, at least
  # as permissive as MIT.
  "CC0-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[advisories]
yanked = "warn"
# Only fail on unmaintained crates we depend on directly. The ones reported
# today (unic-*, proc-macro-error) come in through Tauri and its GTK bindings
# and cannot be replaced from here; they are tracked upstream.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
