# cargo-deny: license / advisory / duplicate-dependency gate used in CI.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[advisories]
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
