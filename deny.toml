# cargo-deny: license / advisory / duplicate-dependency gate used in CI.
[licenses]
# Lumina's own crates (publish = false) are GPL-3.0-only; this gate is about
# the licenses of the dependencies.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  # webpki-roots / webpki-root-certs (Mozilla's CA list, used by every rustls
  # HTTPS client including Tauri's): a permissive open-data licence.
  "CDLA-Permissive-2.0",
  # notify (the projects-folder watcher): a public-domain dedication, at least
  # as permissive as MIT.
  "CC0-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[advisories]
yanked = "warn"
# Only fail on unmaintained crates we depend on directly. The ones reported
# today (unic-*, proc-macro-error) come in through Tauri and its GTK bindings
# and cannot be replaced from here; they are tracked upstream.
unmaintained = "workspace"
# zip 4.x, pulled in only by tauri-plugin-updater (every release, 2.14.0 and
# 3.0.0-alpha.3 included, requires zip ^4, and 4.x has no fixed release).
# Lumina itself uses zip 9. The advisories concern ZipArchive::extract() on
# attacker-supplied archives creating SUID/SGID files or symlinks that point
# outside the destination; the updater uses zip on Windows only (no SUID bits
# or such symlinks there) and only for an update whose signature it verified
# first. Remove these once the updater moves to zip >= 9.
ignore = [
  { id = "RUSTSEC-2026-0367", reason = "zip 4.x via tauri-plugin-updater only: Windows, signed updates" },
  { id = "RUSTSEC-2026-0368", reason = "zip 4.x via tauri-plugin-updater only: Windows, signed updates" },
  { id = "RUSTSEC-2026-0369", reason = "zip 4.x via tauri-plugin-updater only: Windows, signed updates" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
