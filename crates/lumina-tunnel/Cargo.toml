[package]
name = "lumina-tunnel"
description = "Share local sites publicly via Ngrok"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
specta = { workspace = true }
lumina-core = { workspace = true }
lumina-process = { workspace = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# The authtoken lives in the OS credential store: Windows Credential Manager,
# the macOS Keychain, the Secret Service on Linux (pure-Rust D-Bus, no libdbus).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust"] }

[dev-dependencies]
sysinfo = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
