[package]
name = "lumina-desktop"
description = "Lumina desktop application (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "lumina_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Tests are in tests/ (see build.rs: they need the Windows app manifest).
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumina-core     = { workspace = true }
lumina-config   = { workspace = true }
lumina-platform = { workspace = true }
lumina-process  = { workspace = true }
lumina-services = { workspace = true }
lumina-vhost    = { workspace = true }
lumina-ssl      = { workspace = true }
lumina-packages = { workspace = true }
lumina-quickapp = { workspace = true }
lumina-tunnel   = { workspace = true }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
specta = { workspace = true }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
tauri-plugin-autostart = "2"

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
minisign-verify = "0.3"
base64 = "0.23"
