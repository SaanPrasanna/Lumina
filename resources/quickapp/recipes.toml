# --- Node.js (Vite) ---------------------------------------------------------

[[recipe]]
id = "vite"
name = "Vite"
description = "A Vite front-end project, built once so the site shows it; run `npm run dev` while you work."
homepage = "https://vite.dev"
category = "starter"
needs = ["node"]
docroot = "dist"

[recipe.env]
# `npm create` would otherwise ask before installing create-vite.
npm_config_yes = "true"

[[recipe.option]]
id = "template"
label = "Template"
default = "vanilla-ts"
choices = [
  { value = "vanilla-ts", label = "Vanilla (TypeScript)" },
  { value = "react-ts", label = "React (TypeScript)" },
  { value = "vue-ts", label = "Vue (TypeScript)" },
  { value = "svelte-ts", label = "Svelte (TypeScript)" },
  { value = "preact-ts", label = "Preact (TypeScript)" },
  { value = "solid-ts", label = "Solid (TypeScript)" },
  { value = "lit-ts", label = "Lit (TypeScript)" },
  { value = "vanilla", label = "Vanilla (JavaScript)" },
]

[[recipe.step]]
label = "Create the Vite project"
type = "run"
program = "npm"
cwd = "{www}"
args = ["create", "vite@latest", "{name}", "--", "--template", "{template}", "--no-interactive", "--no-immediate"]

[[recipe.step]]
label = "Install the packages"
type = "run"
program = "npm"
args = ["install", "--no-audit", "--no-fund"]

[[recipe.step]]
label = "Build the site"
type = "run"
program = "npm"
args = ["run", "build"]
