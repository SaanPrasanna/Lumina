# Lumina configuration.
# Lives at <data-root>/config.toml. Lumina rewrites this file when you change
# settings in the app; the previous version is kept as config.toml.bak.
schema_version = 1

[general]
# Projects folder; empty = <data-root>/www.
www_root = ""
tld = "test"                 # folder "blog" in the projects folder -> http://blog.test
auto_vhosts = true           # a virtual host + hosts entry for every project folder
auto_ssl = true              # https:// for every site, from Lumina's local certificate authority
force_https = false          # redirect http:// to https:// on every site
start_on_login = false
autostart_services = false   # start PHP + web server when Lumina opens
close_to_tray = true         # closing the window keeps Lumina running in the tray

[php]
# Empty = newest installed version. Otherwise "8.4" (newest 8.4.x) or "8.4.13".
version = ""
fcgi_port = 10987            # chosen to avoid Xdebug's 9000/9003
fcgi_fallback_port = 20987   # used when fcgi_port is busy
fcgi_children = 10           # PHP_FCGI_CHILDREN (minimum 4 is enforced)
fcgi_max_requests = 0        # PHP_FCGI_MAX_REQUESTS (0 = unlimited)

[web]
server = "nginx"             # "nginx" | "apache"
nginx_version = ""           # empty = newest installed
apache_version = ""
http_port = 80
https_port = 443

[database]
engine = "mysql"             # "mysql" | "mariadb"
mysql_version = ""           # empty = newest installed
mariadb_version = ""
port = 3306                  # root@127.0.0.1 with an empty password (local only)

[redis]
enabled = false              # start Redis with "Start All"
version = ""                 # empty = newest installed
port = 6379

[postgresql]
enabled = false              # start PostgreSQL with Start All (it runs next to MySQL/MariaDB)
version = ""                 # empty = newest installed; "17" = newest 17.x
port = 5432

[editor]
# Default: Notepad++ on Windows, VS Code on macOS and Linux. Choose another
# in Settings, or set it here:
# name = "VS Code"
# command = "code"           # a name on PATH or a full path
# args = ["{path}"]          # {path} is replaced with the folder or file to open
# args_line = ["--goto", "{path}:{line}"]   # to open a file at a line; empty = args

[tunnel]
provider = "ngrok"           # the auth token is stored in the OS keychain, not here
domain = ""                  # a reserved ngrok domain to share with; empty = a random address

[profiles]
active = "default"
# Saved stacks, switched in one click from the Profiles page or the tray:
# [[profiles.list]]
# name = "Legacy"
# web = "apache"               # "nginx" | "apache"
# web_version = ""             # empty = newest installed
# php = "8.3"                  # newest 8.3.x
# database = { engine = "mysql", version = "8.4" }
# redis = false

[tools]
# Versions of tools that are not services; empty = newest installed.
node = ""
python = ""
composer = ""
phpmyadmin = ""              # empty = newest that runs on the active PHP
ngrok = ""

[updates]
channel = "stable"           # "stable" | "beta" (pre-releases)
check = true                 # look for a new version at start-up and once a day

[packages]
proxy = ""                   # e.g. "http://proxy:8080" for Quick Add downloads; empty = system settings

# Per-site settings, keyed by folder name (the section is optional):
# [sites.blog]
# enabled = true             # false = no blog.test
# docroot = "dist"           # relative to the folder or absolute; empty = detect
#                            # (public/, web/, public_html/, then the folder itself)
