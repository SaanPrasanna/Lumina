# Lumina configuration (equivalent of laragon.ini). Created on first run.
schema_version = 1

[general]
language = "en"
www_root = "{{data}}/www"
tld = "test"
auto_vhosts = true
auto_ssl = true
start_on_login = false

[php]
version = ""                 # empty = latest installed
fcgi_port = 10987
fcgi_fallback_port = 20987
fcgi_children = 10           # PHP_FCGI_CHILDREN (minimum 4 enforced)
fcgi_max_requests = 0        # PHP_FCGI_MAX_REQUESTS (0 = unlimited)

[web]
server = "nginx"             # "nginx" | "apache"
http_port = 80
https_port = 443

[database]
engine = "mysql"             # "mysql" | "mariadb"
port = 3306

[redis]
enabled = false
port = 6379

[editor]
name = "VS Code"
command = "code"
args = ["{path}"]

[tunnel]
provider = "ngrok"
authtoken = ""

[profiles]
active = "default"
