name: Release

# Every push to master publishes the installers as the GitHub release of the
# version in apps/desktop/src-tauri/tauri.conf.json (tag v<version>):
#   - a new version creates a new release;
#   - more changes on the same version replace that release's files and move
#     its tag to the new commit.
# A version with a pre-release part (1.0.0-beta.1) becomes a pre-release,
# which only the beta update channel offers.
#
# Note: installed copies update only to a *higher* version. Rebuilding the
# same version refreshes the downloads, not existing installs.
#
# Secrets (each optional; without them that step is skipped and the build is
# unsigned):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#       update signatures (required for updates to install; the public key is
#       in tauri.conf.json)
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID,
#   TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT, TRUSTED_SIGNING_PROFILE
#       Windows Authenticode through Azure Trusted Signing
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#       macOS Developer ID signing and notarization

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time; a newer push waits instead of racing the uploads.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
      matrix: ${{ steps.targets.outputs.matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the version
        id: version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "no version in tauri.conf.json" >&2
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release v$version (pre-release: $prerelease)"
      - name: Choose the targets
        id: targets
        env:
          # Repository variable: set LINUX_ARM64=true once arm64 runners are
          # available to this repository (free for public repositories).
          LINUX_ARM64: ${{ vars.LINUX_ARM64 }}
        run: |
          release="--config src-tauri/tauri.release.conf.json"
          windows="$release --config src-tauri/tauri.release.windows.conf.json"
          matrix=$(jq -nc \
            --arg release "$release" --arg windows "$windows" --arg arm "$LINUX_ARM64" \
            --arg crt "-C target-feature=+crt-static" '
            [
              {name: "Windows x64",   runner: "windows-latest", rust_targets: "", rustflags: $crt,
               args: ("--bundles nsis,msi " + $windows)},
              {name: "Windows ARM64", runner: "windows-latest", rust_targets: "aarch64-pc-windows-msvc", rustflags: $crt,
               args: ("--target aarch64-pc-windows-msvc --bundles nsis,msi " + $windows)},
              {name: "macOS (Apple Silicon + Intel)", runner: "macos-latest", rustflags: "",
               rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin",
               args: ("--target universal-apple-darwin " + $release)},
              {name: "Linux x64", runner: "ubuntu-22.04", rust_targets: "", rustflags: "",
               args: ("--bundles deb,rpm,appimage " + $release)}
            ]
            + (if $arm == "true" then
                [{name: "Linux ARM64", runner: "ubuntu-22.04-arm", rust_targets: "", rustflags: "",
                  args: ("--bundles deb,rpm,appimage " + $release)}]
              else [] end)
            | {include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .
      - name: Create or reset the release
        id: release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # The tag always points at the commit being released.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists: replacing its files"
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --title "Lumina $TAG"
          else
            echo "Creating release $TAG"
            flags=""
            [ "$PRERELEASE" = "true" ] && flags="--prerelease"
            gh release create "$TAG" --title "Lumina $TAG" --generate-notes --verify-tag $flags
          fi
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.TRUSTED_SIGNING_ACCOUNT != '' }}
      # Windows: the C runtime is linked in, so Lumina itself needs no VC++
      # runtime (the ARM64 build would need an ARM64 one); the bundled x64
      # runtime is for the x64 servers (PHP, Apache), also on Windows on ARM.
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Fetch the Visual C++ runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-vcredist.ps1
      - name: Windows code signing (Azure Trusted Signing)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          cargo install trusted-signing-cli --locked
          # Tauri signs the app, the sidecars and the installer with this command.
          $config = @{ bundle = @{ windows = @{ signCommand = "trusted-signing-cli -e $env:ENDPOINT -a $env:ACCOUNT -c $env:PROFILE -d Lumina %1" } } }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 apps/desktop/src-tauri/tauri.signing.conf.json
          "SIGNING_ARGS=--config src-tauri/tauri.signing.conf.json" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ env.SIGNING_ARGS }}

  # The stable channel reads releases/latest/download/latest.json, which
  # GitHub serves from the newest non-pre-release. The beta channel reads the
  # rolling `beta` release, which gets the latest.json of every release.
  beta-channel:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Copy latest.json to the beta channel
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern latest.json
          if ! gh release view beta --repo "$REPO" > /dev/null 2>&1; then
            gh release create beta --repo "$REPO" --prerelease \
              --title "Beta update channel" \
              --notes "Holds latest.json for Lumina's beta update channel. Do not delete."
          fi
          gh release upload beta latest.json --repo "$REPO" --clobber
