# Builds the portable servers that Quick Add installs on macOS and Linux
# (PHP, nginx, Redis, PostgreSQL), where their projects publish no portable
# builds, and publishes them on the `server-binaries` pre-release. The package
# catalog (resources/catalog/packages.json) points at those files and pins
# their SHA-256.
#
# Runs when the build script or this workflow changes on dev, or by hand.
name: Server binaries

on:
  push:
    branches: [dev]
    paths:
      - "packaging/binaries/**"
      - ".github/workflows/binaries.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-binaries
  cancel-in-progress: false

env:
  RELEASE_TAG: server-binaries

jobs:
  build:
    name: ${{ matrix.tool_version }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [macos-aarch64, macos-x86_64, linux-x86_64, linux-aarch64]
        tool_version:
          - php 8.5.11
          - php 8.4.26
          - php 8.3.35
          - php 8.2.34
          - nginx 1.31.6
          - nginx 1.30.5
          - redis 8.10.2
          - redis 8.8.3
          - postgresql 18.6
          - postgresql 17.11
        include:
          - target: macos-aarch64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          # Ubuntu 22.04: the builds run on glibc 2.35 and newer.
          - target: linux-x86_64
            runner: ubuntu-22.04
          - target: linux-aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Split tool and version
        id: tv
        env:
          TV: ${{ matrix.tool_version }}
        run: |
          {
            echo "tool=${TV% *}"
            echo "version=${TV#* }"
          } >> "$GITHUB_OUTPUT"

      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config patchelf file zlib1g-dev

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash packaging/binaries/build.sh \
            "${{ steps.tv.outputs.tool }}" "${{ steps.tv.outputs.version }}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tv.outputs.tool }}-${{ steps.tv.outputs.version }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    # Publish what was built even if some builds failed; the summary lists them.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the server-binaries release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::nothing was built"
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A pre-release that is never "latest": the app's updater and the
            # website read the latest Lumina release.
            gh release create "$RELEASE_TAG" --prerelease --latest=false \
              --title "Server binaries for macOS and Linux" \
              --notes "Portable PHP, nginx, Redis and PostgreSQL builds that Lumina's Quick Add installs on macOS and Linux. Built by .github/workflows/binaries.yml from the official sources; each file's SHA-256 is pinned in the package catalog. Not a Lumina release."
          fi
          (cd dist && sha256sum ./*.tar.gz | sed 's| \./| |' > SHA256SUMS-new.txt)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          # Merge with the checksums of files built by earlier runs.
          gh release download "$RELEASE_TAG" -p SHA256SUMS.txt -D old 2>/dev/null || true
          cat old/SHA256SUMS.txt dist/SHA256SUMS-new.txt 2>/dev/null |
            awk '{ sum[$2] = $1 } END { for (f in sum) print sum[f] "  " f }' | sort -k2 > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
          {
            echo "### Published to $RELEASE_TAG"
            echo '```'
            cat dist/SHA256SUMS-new.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
