version: 2

# PRs target `dev` (where work happens) so they never conflict with it; changes
# reach `master` through dev → master merges. Minor and patch updates are
# grouped into one PR per ecosystem; major updates stay separate because they
# usually need code changes.
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; lift once it supports 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      actions-minor:
        update-types: [minor, patch]
